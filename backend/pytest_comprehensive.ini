[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v 
    -s 
    --strict-markers 
    --tb=short
    --maxfail=5
    --durations=10
    --cov=app 
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --cov-report=json:coverage.json
    --cov-report=term-missing
    --cov-fail-under=75
    --cov-config=.coveragerc

markers = 
    unit: marks tests as unit tests (fast, isolated)
    integration: marks tests as integration tests (slower, with external dependencies)
    e2e: marks tests as end-to-end tests (slowest, full system)
    slow: marks tests as slow running (deselect with '-m "not slow"')
    performance: marks tests as performance tests
    smoke: marks tests as smoke tests (basic functionality)
    regression: marks tests as regression tests
    security: marks tests as security tests
    api: marks tests as API tests
    database: marks tests as database tests
    cache: marks tests as cache tests
    auth: marks tests as authentication tests
    ai: marks tests as AI/ML tests
    gamification: marks tests as gamification tests
    analytics: marks tests as analytics tests

asyncio_mode = auto
timeout = 300
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:firebase_admin.*
    ignore::UserWarning:google.*
    ignore::RuntimeWarning:asyncio.*

# Test collection configuration
collect_ignore = [
    "setup.py",
    "conftest.py.bak",
    "conftest.tmp.py",
    "__pycache__"
]

# Minimum version requirements
minversion = 6.0

# Test discovery patterns
testpaths = tests
norecursedirs = .git .tox dist build *.egg __pycache__ .pytest_cache htmlcov

# Parallel execution (if pytest-xdist is installed)
# addopts = -n auto

# Coverage configuration
[coverage:run]
source = app
omit = 
    */tests/*
    */test_*
    */conftest.py
    */migrations/*
    */alembic/*
    */__pycache__/*
    */venv/*
    */env/*
    */node_modules/*
    */.git/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod
    # Type checking imports
    if TYPE_CHECKING:

precision = 2
show_missing = true
skip_covered = false
sort = Cover

[coverage:html]
directory = htmlcov
title = Klymate AI Backend Test Coverage

[coverage:xml]
output = coverage.xml

[coverage:json]
output = coverage.json
pretty_print = true