name: CD Pipeline

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production

env:
  PYTHON_VERSION: '3.11'
  REGISTRY: ghcr.io
  IMAGE_NAME: klymate-backend

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    environment: staging
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-
          type=raw,value=staging-latest

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Deploy to Railway (Staging)
      if: ${{ secrets.RAILWAY_TOKEN }}
      run: |
        # Install Railway CLI
        curl -fsSL https://railway.app/install.sh | sh
        
        # Deploy to Railway
        railway login --token ${{ secrets.RAILWAY_TOKEN }}
        railway up --service backend-staging
      env:
        RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

    - name: Deploy to Render (Staging)
      if: ${{ secrets.RENDER_API_KEY }}
      run: |
        curl -X POST \
          -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
          -H "Content-Type: application/json" \
          -d '{"clearCache": false}' \
          "https://api.render.com/v1/services/${{ secrets.RENDER_STAGING_SERVICE_ID }}/deploys"
      env:
        RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        RENDER_STAGING_SERVICE_ID: ${{ secrets.RENDER_STAGING_SERVICE_ID }}

    - name: Health check staging deployment
      run: |
        # Wait for deployment to be ready
        sleep 30
        
        # Health check with retry logic
        for i in {1..10}; do
          if curl -f ${{ secrets.STAGING_URL }}/health; then
            echo "✅ Staging deployment is healthy"
            break
          else
            echo "⏳ Waiting for staging deployment... (attempt $i/10)"
            sleep 30
          fi
          
          if [ $i -eq 10 ]; then
            echo "❌ Staging deployment health check failed"
            exit 1
          fi
        done

    - name: Run smoke tests on staging
      run: |
        # Basic API smoke tests
        curl -f ${{ secrets.STAGING_URL }}/api/v1/health || exit 1
        echo "✅ Staging smoke tests passed"

  deploy-production:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'
    environment: production
    needs: deploy-staging
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-
          type=raw,value=production-latest
          type=raw,value=latest

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Deploy to Railway (Production)
      if: ${{ secrets.RAILWAY_TOKEN }}
      run: |
        # Install Railway CLI
        curl -fsSL https://railway.app/install.sh | sh
        
        # Deploy to Railway
        railway login --token ${{ secrets.RAILWAY_TOKEN }}
        railway up --service backend-production
      env:
        RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

    - name: Deploy to Render (Production)
      if: ${{ secrets.RENDER_API_KEY }}
      run: |
        curl -X POST \
          -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
          -H "Content-Type: application/json" \
          -d '{"clearCache": false}' \
          "https://api.render.com/v1/services/${{ secrets.RENDER_PRODUCTION_SERVICE_ID }}/deploys"
      env:
        RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        RENDER_PRODUCTION_SERVICE_ID: ${{ secrets.RENDER_PRODUCTION_SERVICE_ID }}

    - name: Health check production deployment
      run: |
        # Wait for deployment to be ready
        sleep 60
        
        # Health check with retry logic
        for i in {1..15}; do
          if curl -f ${{ secrets.PRODUCTION_URL }}/health; then
            echo "✅ Production deployment is healthy"
            break
          else
            echo "⏳ Waiting for production deployment... (attempt $i/15)"
            sleep 30
          fi
          
          if [ $i -eq 15 ]; then
            echo "❌ Production deployment health check failed"
            # Trigger rollback
            echo "🔄 Triggering rollback..."
            exit 1
          fi
        done

    - name: Run comprehensive tests on production
      run: |
        # Comprehensive API tests
        curl -f ${{ secrets.PRODUCTION_URL }}/api/v1/health || exit 1
        curl -f ${{ secrets.PRODUCTION_URL }}/api/v1/habits/categories || exit 1
        echo "✅ Production tests passed"

    - name: Create GitHub release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ github.run_number }}
        release_name: Release v${{ github.run_number }}
        body: |
          🚀 Production deployment successful!
          
          **Changes in this release:**
          ${{ github.event.head_commit.message }}
          
          **Deployment Details:**
          - Commit: ${{ github.sha }}
          - Branch: ${{ github.ref_name }}
          - Deployed at: ${{ github.event.head_commit.timestamp }}
        draft: false
        prerelease: false

  rollback:
    runs-on: ubuntu-latest
    if: failure() && (needs.deploy-staging.result == 'failure' || needs.deploy-production.result == 'failure')
    needs: [deploy-staging, deploy-production]
    environment: production
    
    steps:
    - name: Rollback deployment
      run: |
        echo "🔄 Rolling back deployment due to failure..."
        
        # Railway rollback
        if [ "${{ secrets.RAILWAY_TOKEN }}" ]; then
          curl -fsSL https://railway.app/install.sh | sh
          railway login --token ${{ secrets.RAILWAY_TOKEN }}
          railway rollback --service backend-production
        fi
        
        # Render rollback (manual process - would need API support)
        echo "⚠️ Manual rollback may be required for Render deployment"
        
        echo "✅ Rollback initiated"

  notify:
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production]
    if: always()
    
    steps:
    - name: Notify deployment success
      if: ${{ needs.deploy-staging.result == 'success' && (needs.deploy-production.result == 'success' || needs.deploy-production.result == 'skipped') }}
      run: |
        echo "🎉 Deployment completed successfully!"
        
    - name: Notify deployment failure
      if: ${{ needs.deploy-staging.result == 'failure' || needs.deploy-production.result == 'failure' }}
      run: |
        echo "💥 Deployment failed. Check logs and consider rollback."
        exit 1